[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/bc-cms/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html/bc-cms
autostart=%(ENV_ENABLE_WORKER)s
autorestart=true
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron-scheduler]
command=/bin/sh -c "while true; do php /var/www/html/bc-cms/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/html/bc-cms
autostart=%(ENV_ENABLE_SCHEDULER)s
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
