apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tourvisor.fullname" . }}-secret
  labels:
    {{- include "tourvisor.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ .Values.secrets.appKey | quote }}
  DB_USERNAME: {{ .Values.secrets.dbUsername | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MAIL_USERNAME: {{ .Values.secrets.mailUsername | quote }}
  MAIL_PASSWORD: {{ .Values.secrets.mailPassword | quote }}
