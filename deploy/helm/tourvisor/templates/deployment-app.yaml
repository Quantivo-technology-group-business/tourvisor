apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tourvisor.fullname" . }}-app
  labels:
    {{- include "tourvisor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tourvisor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "tourvisor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # PHP-FPM Application Container
        - name: app
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "tourvisor.fullname" . }}-config
            - secretRef:
                name: {{ include "tourvisor.fullname" . }}-secret
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.uploads.enabled }}
            - name: uploads
              mountPath: /var/www/html/public_html/uploads
            {{- end }}
            {{- if .Values.persistence.storage.enabled }}
            - name: storage
              mountPath: /var/www/html/bc-cms/storage
            {{- end }}

        # Nginx Web Container
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.uploads.enabled }}
            - name: uploads
              mountPath: /var/www/html/public_html/uploads
            {{- end }}

      volumes:
        {{- if .Values.persistence.uploads.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "tourvisor.fullname" . }}-uploads-pvc
        {{- end }}
        {{- if .Values.persistence.storage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "tourvisor.fullname" . }}-storage-pvc
        {{- end }}
